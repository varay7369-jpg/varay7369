<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VARAY — Audition Application</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header Navbar -->
  <header class="navbar">
    <a href="index.html" class="brand">VARAY</a>
    <div class="nav-actions">
      <button class="theme-toggle-btn" aria-label="Toggle Theme">
        <div class="dot"></div>
      </button>
      <button class="hamburger-btn" id="menuBtn" aria-label="Open Menu">
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="fa" data-code="FA">فارسی (FA)</button>
          <button class="lang-option" data-lang="fr" data-code="FR">Français (FR)</button>
        </div>
      </div>
      <div class="menu-serial">#VRY-7369</div>
    </div>
  </div>

  <!-- Content Container -->
  <main class="page-container">
    <div class="content-wrapper">
      <div class="page-header">
        <span class="section-tag">GLOBAL RECRUITMENT</span>
        <h1 class="page-title">APPLY AUDITION</h1>
        <p class="page-description">Submit your official application for VARAY global trainee intake.</p>
      </div>

      <div class="card-panel">
        <form id="auditionForm">
          
          <div class="field-box">
            <label>Full Name</label>
            <input type="text" placeholder="Enter your full legal name" required>
          </div>

          <div class="field-box">
            <label>Category</label>
            <div class="custom-select-wrapper">
              <input type="hidden" name="category" value="vocal">
              <div class="custom-select-trigger">
                <span class="trigger-value">Vocalist</span>
                <span style="font-size:0.7rem; color:var(--muted)">▼</span>
              </div>
              <div class="custom-dropdown-panel">
                <div class="dropdown-item active" data-val="vocal">Vocalist</div>
                <div class="dropdown-item" data-val="dance">Dancer / Choreography</div>
                <div class="dropdown-item" data-val="rap">Rap / Performance</div>
                <div class="dropdown-item" data-val="acting">Acting / Modeling</div>
                <div class="dropdown-item" data-val="producer">Music Producer</div>
              </div>
            </div>
          </div>

          <div class="field-box">
            <label>Email Address</label>
            <input type="email" placeholder="example@domain.com" required>
          </div>

          <div class="field-box">
            <label>Portfolio / Video Link</label>
            <input type="url" placeholder="https://youtube.com/... or cloud link" required>
          </div>

          <div class="field-box">
            <label>Self Introduction & Experience</label>
            <textarea rows="4" placeholder="Briefly describe your musical background, skills and goals..."></textarea>
          </div>

          <div style="margin-top: 30px;">
            <button type="submit" class="pill-btn primary" style="width: 100%;">SUBMIT DOSSIER</button>
          </div>

        </form>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
